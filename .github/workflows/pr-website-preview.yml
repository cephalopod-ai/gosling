name: Documentation Site Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - 'documentation/**'

permissions: {}

concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout the branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js for docs build
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: documentation/package-lock.json

      - name: Install dependencies and build docs
        working-directory: ./documentation
        env:
          TARGET_PATH: /
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Verify docs map was generated
        working-directory: ./documentation
        run: ./scripts/verify-build.sh

      - name: Upload preview files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: documentation-preview
          path: documentation/build
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PAGES_PR_PREVIEW_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.PAGES_PR_PREVIEW_CF_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.PAGES_PR_PREVIEW_CF_PAGES_PROJECT_NAME }}
    steps:
      # No checkout or PR-controlled package/config files in this credential-bearing job.
      - name: Download preview files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: documentation-preview
          path: ${{ runner.temp }}/docs-preview/build

      - name: Setup Node.js for Wrangler
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22

      - name: Deploy preview to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        id: cloudflare-pages
        working-directory: ${{ runner.temp }}/docs-preview
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail

          output=$(npx --yes wrangler@4.149.0 pages deploy build \
            --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch="pr-$PR_NUMBER" \
            --commit-dirty=true 2>&1 | tee /dev/stderr)

          preview_url=$(echo "$output" | grep -Eo 'https://[^[:space:]]+' | tail -n 1)
          if [ -z "$preview_url" ]; then
            echo "Failed to find Cloudflare Pages preview URL in wrangler output" >&2
            exit 1
          fi

          echo "preview-url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.cloudflare-pages.outputs.preview-url }}
        with:
          script: |
            const marker = '<!-- documentation-site-preview -->';
            const body = `${marker}\nDocumentation preview deployed: ${process.env.PREVIEW_URL}`;

            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const {data: comments} = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existingComment = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

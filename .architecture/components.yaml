version: 1

owners:
  core_maintainers:
    github:
      - "@e3742526"

components:
  - id: desktop.ipc_contract
    owners: [core_maintainers]
    paths:
      - ui/desktop/src/ipc
      - ui/desktop/src/preload.ts
      - ui/desktop/src/main.ts
      - ui/desktop/src/main
      - ui/desktop/src/utils/autoUpdater.ts
    responsibilities:
      - define channel names and payload types shared by preload and main
      - keep renderer-facing privileged API surface minimal
    notes:
      - preload must not expose dead or unhandled privileged methods

  - id: compatibility.goose_catalog_adapter
    owners: [core_maintainers]
    paths:
      - documentation/GOOSE_COMPATIBILITY.md
      - documentation/scripts/goose-compat.js
    responsibilities:
      - preserve deterministic Goose catalog fallback behavior
      - keep provenance and normalization explicit

  - id: shell.consumer_composition
    owners: [core_maintainers]
    paths:
      - ui/desktop/scripts
      - ui/desktop/forge.config.ts
      - ui/desktop/vite.shell.renderer.config.mts
      - ui/shell-kit/src/shell-consumer.js
    responsibilities:
      - resolve trusted consumer manifests and renderer entries
      - keep Electron host main and preload entries immutable across consumers
      - reject consumer-supplied privilege, process, and path authority

  - id: shell.application_runtime
    owners: [core_maintainers]
    paths:
      - ui/desktop/src/shell
    responsibilities:
      - own the authenticated ACP connection in Electron main
      - expose only bounded application capabilities to consumer renderers
      - fence session, prompt, and interaction lifecycle state

  - id: shell.domain_adapter
    owners: [core_maintainers]
    paths:
      - crates/gosling/src/acp/domain_adapter.rs
      - crates/gosling/src/acp/shell.rs
      - crates/gosling/src/acp/server/shell_handlers.rs
      - crates/gosling-cli/src/cli.rs
      - crates/gosling-sdk-types/src/shell.rs
    responsibilities:
      - negotiate and supervise registered out-of-process domain adapters
      - keep domain authorization and confirmation in the Rust server
      - prevent descriptor-only domain capability from reaching ready state

  - id: core.session_planning
    owners: [core_maintainers]
    paths:
      - crates/gosling/src/session/plans.rs
      - crates/gosling/src/session/diagnostics.rs
      - crates/gosling/src/session/session_manager.rs
      - crates/gosling/src/session/session_manager/schema.rs
      - crates/gosling/src/session/session_manager/migrations.rs
      - crates/gosling/src/session/session_manager/pool_lifecycle.rs
      - crates/gosling/src/session/session_manager/plan_storage.rs
      - crates/gosling/src/session/session_manager/message_storage.rs
      - crates/gosling/src/session/session_manager/session_crud.rs
      - crates/gosling/src/session/session_manager/session_transfer.rs
      - crates/gosling/src/session/session_manager/handoff_storage.rs
      - crates/gosling/src/workspace/planning_access.rs
      - crates/gosling/src/agents/platform_extensions/planning.rs
      - crates/gosling/src/prompts/plan.md
      - crates/gosling/src/acp/server/plans.rs
      - crates/gosling-sdk-types/src/custom_requests.rs
      - crates/gosling-sdk-types/src/custom_notifications.rs
      - crates/gosling-cli/src/session
    responsibilities:
      - own durable plan generations, immutable revisions, feedback, events, and decisions
      - bind plan transitions to current transcript and workspace evidence
      - project typed plan state through ACP and first-party CLI workflows
      - preserve plan history without transferring approval authority across session boundaries
    notes:
      - source implementation is present; release conformance depends on the recorded validation evidence

  - id: core.recall_brief_reporting
    owners: [core_maintainers]
    paths:
      - crates/gosling/src/recall_brief
      - crates/gosling/src/acp/server/recall_brief.rs
      - crates/gosling/src/acp/server/custom_dispatch.rs
      - crates/gosling-sdk-types/src/recall_brief.rs
      - crates/gosling/tests/recall_brief.rs
      - crates/gosling/tests/fixtures/recall_brief_santa.json
    responsibilities:
      - interpret only selected session-enrolled Muninn recall results through the existing MCP permission path
      - bind every displayed source to an exact pinned store, memory identity, and revision
      - validate model-proposed quotes and source coverage before rendering a typed report
      - disclose partial retrieval and synthesis degradation without writing memory
    notes:
      - the first source entrypoint is typed ACP; CLI and Desktop UX entrypoints are not implemented in this slice
      - source tests check structural provenance, not arbitrary paraphrase or external-world truth

  - id: core.context_compaction_history
    owners: [core_maintainers]
    paths:
      - crates/gosling/src/session/session_manager/compaction_history_storage.rs
      - crates/gosling/src/session/session_manager/schema.rs
      - crates/gosling/src/session/session_manager/migrations.rs
      - crates/gosling/src/acp/server/compaction_history.rs
      - crates/gosling/src/context_mgmt/summarizer
      - crates/gosling-sdk-types/src/custom_requests.rs
      - crates/gosling-cli/src/commands/session.rs
      - ui/desktop/src/acp/contextHistory.ts
      - ui/desktop/src/components/conversation/ContextHistoryDialog.tsx
      - ui/desktop/src/components/conversation/ContextHistoryDiff.tsx
      - ui/desktop/src/components/settings/app/ContextHistorySettings.tsx
    responsibilities:
      - append one independent versioned revision per successful compaction inside the committing transaction
      - own retention, grace, count, and byte policy together with pinning and purge accounting
      - keep compaction payloads out of ordinary session export, sharing, and telemetry
      - project read and policy operations through typed ACP to the CLI and Desktop surfaces
    notes:
      - the config file and the SQLite ledger are separate durability stores; an unresolved post-save failure is reported as a partial apply
      - this is local walkthrough and recovery history, not a tamper-proof or compliance-grade audit log

  - id: desktop.plan_review
    owners: [core_maintainers]
    paths:
      - ui/desktop/src/acp/plans.ts
      - ui/desktop/src/acp/chatNotifications.ts
      - ui/desktop/src/acp/chatSessionController.ts
      - ui/desktop/src/acp/chatSessionStore.ts
      - ui/desktop/src/acp/adapter/goslingSessionNotifications.ts
      - ui/desktop/src/components/BaseChat.tsx
      - ui/desktop/src/components/ChatInput.tsx
      - ui/desktop/src/components/plans
      - ui/desktop/src/hooks/useChatSession.ts
      - ui/desktop/src/hooks/useChatSessionTypes.ts
    responsibilities:
      - project typed plan state into the first-party review workflow
      - bind feedback and decisions to an exact revision
      - keep approval separate from implementation submission
    notes:
      - source implementation is present; this ownership entry is not a candidate-wide conformance or published-release claim

  - id: security.planning_execution_boundary
    owners: [core_maintainers]
    paths:
      - crates/gosling/src/agents/interaction_policy.rs
      - crates/gosling/src/agents/agent.rs
      - crates/gosling/src/agents/agent/extensions.rs
      - crates/gosling/src/agents/agent/frontend_extensions.rs
      - crates/gosling/src/agents/agent/hooks.rs
      - crates/gosling/src/agents/agent/prompt_apis.rs
      - crates/gosling/src/agents/agent/reply_context.rs
      - crates/gosling/src/agents/agent/reply_entry.rs
      - crates/gosling/src/agents/agent/reply_stream.rs
      - crates/gosling/src/agents/agent/provider_transitions.rs
      - crates/gosling/src/agents/agent/tool_dispatch.rs
      - crates/gosling/src/agents/prompt_manager.rs
      - crates/gosling/src/agents/extension_manager/tool_catalog.rs
      - crates/gosling/src/agents/extension_manager/tool_dispatch.rs
      - crates/gosling/src/agents/extension_manager/tool_metadata.rs
      - crates/gosling/src/agents/extension_manager.rs
      - crates/gosling/src/agents/extension_manager/lifecycle.rs
      - crates/gosling/src/agents/moim.rs
      - crates/gosling/src/agents/platform_extensions/code_execution.rs
      - crates/gosling/src/agents/platform_extensions/mod.rs
      - crates/gosling/src/agents/platform_extensions/planning.rs
      - crates/gosling/src/agents/platform_extensions/session_history.rs
      - crates/gosling/src/agents/reply_parts.rs
      - crates/gosling/src/agents/tool_execution.rs
      - crates/gosling/src/context_mgmt/memory.rs
      - crates/gosling/src/context_mgmt/summarizer
      - crates/gosling/src/hints
      - crates/gosling/src/providers
      - crates/gosling/src/session/session_manager/tool_operations.rs
      - crates/gosling/src/session/session_manager/session_crud.rs
      - crates/gosling/src/acp/server/shell_handlers.rs
      - crates/gosling/src/acp/server/tools.rs
      - crates/gosling-cli/src/session
    responsibilities:
      - capture an immutable interaction policy for each turn
      - derive planning authority only from fixed host-owned capability identities
      - enforce the same planning boundary across catalog, provider, and dispatch paths
      - revalidate durable plan authority atomically with tool-operation begin or replay
      - suppress app-direct actions, command-backed hooks, and implicit hint-file reads while a plan is open
    notes:
      - source implementation is present; release conformance depends on the recorded validation evidence
